services:

  # PostgreSQL + pgvector + parade
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    container_name: scholarrag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-scholarrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarrag}
      POSTGRES_DB:       ${POSTGRES_DB:-scholarrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-scholarrag}", "-d", "${POSTGRES_DB:-scholarrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./docker
      dockerfile: Dockerfile.web
    container_name: scholarrag-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8501}:8501"
    volumes:
      - .:/home/app
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  celery_worker:
    build: 
      context: ./
      dockerfile: ./docker/Dockerfile.queue
    depends_on:
      - redis
      - db
    environment:
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
    volumes:
      - .:/home/app
    command: sh -c "uv sync && exec uv run celery -A celery_app worker -Q ingestion --loglevel=info"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
