services:

  # PostgreSQL + pgvector + parade
  db:
    build:
      context: ./docker
      dockerfile: Dockerfile.db
    container_name: scholarrag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-scholarrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarrag}
      POSTGRES_DB:       ${POSTGRES_DB:-scholarrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-scholarrag}", "-d", "${POSTGRES_DB:-scholarrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./docker
      dockerfile: Dockerfile.web
    container_name: scholarrag-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8501}:8501"
    volumes:
      - .:/home/app
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data

  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    container_name: scholarrag-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: minio server /mnt/data --console-address ":9001"
    volumes:
      - minio_data:/mnt/data
      - ./minio.license:/minio.license # Mount license file

  celery_worker:
    build: 
      context: ./
      dockerfile: ./docker/Dockerfile.queue
    depends_on:
      - redis
      - db
      - storage
    volumes:
      - .:/home/app
    command: sh -c "uv sync && exec uv run celery -A celery_app worker -Q ingestion --loglevel=info"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
