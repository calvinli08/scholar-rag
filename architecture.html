<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScholarRAG — Full Local Architecture</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #fff;
    color: #1a1a1a;
  }
  h1 {
    font-size: 16px;
    font-weight: 500;
    margin: 0 0 4px 0;
    color: #1a1a1a;
  }
  p {
    font-size: 12px;
    color: #666;
    margin: 0 0 20px 0;
  }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .t  { font-size: 14px; fill: #1a1a1a; }
  .ts { font-size: 12px; fill: #666; }
  .th { font-size: 14px; font-weight: 500; fill: #1a1a1a; }
  .arr { stroke: #aaa; stroke-width: 1.5; fill: none; }
  .box { fill: #f5f5f3; stroke: #ccc; }
  .node { cursor: pointer; }
  .node:hover rect, .node:hover circle { opacity: 0.85; }

  /* Color ramps */
  .c-gray rect  { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray .th   { fill: #2C2C2A; }
  .c-gray .ts   { fill: #444441; }

  .c-teal rect  { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal .th   { fill: #085041; }
  .c-teal .ts   { fill: #0F6E56; }

  .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral .th  { fill: #4A1B0C; }
  .c-coral .ts  { fill: #712B13; }

  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th  { fill: #26215C; }
  .c-purple .ts  { fill: #3C3489; }

  .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
  .c-green .th  { fill: #173404; }
  .c-green .ts  { fill: #27500A; }

  @media (prefers-color-scheme: dark) {
    body { background: #1a1a1a; color: #e0ddd6; }
    h1 { color: #e0ddd6; }
    p  { color: #888; }
    .t  { fill: #e0ddd6; }
    .ts { fill: #9c9a92; }
    .th { fill: #e0ddd6; }
    .arr { stroke: #555; }

    .c-gray rect   { fill: #444441; stroke: #B4B2A9; }
    .c-gray .th    { fill: #F1EFE8; }
    .c-gray .ts    { fill: #D3D1C7; }

    .c-teal rect   { fill: #085041; stroke: #5DCAA5; }
    .c-teal .th    { fill: #E1F5EE; }
    .c-teal .ts    { fill: #9FE1CB; }

    .c-coral rect  { fill: #4A1B0C; stroke: #F0997B; }
    .c-coral .th   { fill: #FAECE7; }
    .c-coral .ts   { fill: #F5C4B3; }

    .c-purple rect { fill: #26215C; stroke: #AFA9EC; }
    .c-purple .th  { fill: #EEEDFE; }
    .c-purple .ts  { fill: #CECBF6; }

    .c-green rect  { fill: #173404; stroke: #97C459; }
    .c-green .th   { fill: #EAF3DE; }
    .c-green .ts   { fill: #C0DD97; }
  }
</style>
</head>
