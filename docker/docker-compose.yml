services:

  # PostgreSQL + pgvector + parade
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: scholarrag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-scholarrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scholarrag}
      POSTGRES_DB:       ${POSTGRES_DB:-scholarrag}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-scholarrag}", "-d", "${POSTGRES_DB:-scholarrag}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    driver: local
